{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card card-soft p-4">
      <h1 class="h3 mb-1">Log in</h1>
      <p class="text-muted">Access is limited to authorised healthcare workers and supervisors.</p>
      <form method="post" novalidate>{% csrf_token %}
        {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
        <div class="mb-3"><label class="form-label" for="id_username">Username</label>
          <input class="form-control" id="id_username" name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}"></div>
        <div class="mb-3"><label class="form-label" for="id_password">Password</label>
          <input class="form-control" id="id_password" name="password" type="password" autocomplete="current-password" required></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-mrrh w-100" type="submit">Log in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
